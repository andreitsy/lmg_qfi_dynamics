[Simulation]
; LMG model default values
J = 1.0
N = 10
B = 0.4

; Kicking params
T = 1
phi-kick-phase = pi

; AC field params
; NOTE: frequency estimation (parameter = frequency) requires h != 0, e.g. 0.1
h = 0.01
; nu or freq
frequency = 2
; initial phase
phi-0 = 1.57079632679
; params of field direction
varphi = 0.0
theta = 0.0
epsilon = 0.000001

; Estimated parameter of the AC field: amplitude | frequency
; amplitude: QFI over h via the Floquet-power fast path (default)
; frequency: QFI over omega via phase-continuous sequential evolution
parameter = amplitude
; probe frequency for frequency estimation; "resonant" or a float value
; (resonant = 2*pi/(frequency*T))
omega = resonant
; optional cap on the maximum time, 10^degree kick periods (sequential
; frequency mode costs grow linearly with the maximum time)
; max-time-degree = 4

; Numerical backend: quspin (fast, double precision) | mpmath (arbitrary precision)
solver = quspin

; Simulation arguments

num-points = 100
steps-floquet-unitary = 50

# precision for mpmath
dps = 15

[Files]
output-dir = results
; log-file = run_logging.log
